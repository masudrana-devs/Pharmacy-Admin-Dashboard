  else if(a==='restock'){var p=pm(d.n),l=lots(p).pop();if(!l)return toast('No sellable batch. Add this stock from Purchases.');l.q+=50;sync(p);log('Restock +50 '+p.n+' ('+l.b+')');render();toast(p.n+' +50 • now '+p.s)}
  else if(a==='ret'){var q=pm(d.n),lim=addD(today(),30),bb=q.bt.filter(function(b){return b.q>0&&!b.rs&&b.e<=lim})[0];if(!bb)return;bb.rs='req';sync(q);log('Return requested: '+q.n+' ('+bb.b+')');render();toast('Return logged for '+q.n+' ('+bb.b+')')}

(function(){DICT.sort(function(a,b){return b[0].length-a[0].length});
  DICT.forEach(function(d){MAP[d[0]]=d[1]});
  RX=new RegExp('(?<![A-Za-z])(?:'+DICT.map(function(d){return d[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}).join('|')+')(?![A-Za-z])','g')})();
function conv(s){return s.replace(RX,function(m){return MAP[m]})}
function tr(root){
  var bn=S.lang==='bn',r=root||document.body,w=document.createTreeWalker(r,NodeFilter.SHOW_TEXT,null),n,list=[];
  while(n=w.nextNode())list.push(n);
  list.forEach(function(n){var p=n.parentNode,t=p&&p.nodeName;
    if(!p||t==='SCRIPT'||t==='STYLE'||t==='TEXTAREA'||t==='TITLE')return;
    if(p.id==='lg'||(p.closest&&p.closest('.msg')))return;
    if(bn){if(n.__en===undefined)n.__en=n.nodeValue;var v=conv(n.__en);if(v!==n.nodeValue)n.nodeValue=v}
    else if(n.__en!==undefined&&n.nodeValue!==n.__en){n.nodeValue=n.__en}});
  [].forEach.call(r.querySelectorAll('[placeholder],[aria-label]'),function(el){
    if(el.id==='q')return;
    ['placeholder','aria-label'].forEach(function(a){var v=el.getAttribute(a);if(v===null)return;var k='__en_'+a;
      if(bn){if(el[k]===undefined)el[k]=v;el.setAttribute(a,conv(el[k]))}else if(el[k]!==undefined)el.setAttribute(a,el[k])})})}
function applyLang(){
  document.documentElement.lang=S.lang==='bn'?'bn':'en';

var tx=0,ty=0;document.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',function(e){if(window.innerWidth>=900)return;var dx=e.changedTouches[0].clientX-tx,dy=Math.abs(e.changedTouches[0].clientY-ty),op=$('#sb').classList.contains('open');

/* ===== CORE: dates, safety, persistence, batches, sales engine ===== */
function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function today(){return iso(new Date())}
function addD(s,n){var a=s.split('-');return iso(new Date(+a[0],+a[1]-1,+a[2]+n))}
function diffD(a,b){return Math.round((Date.parse(a+'T00:00:00Z')-Date.parse(b+'T00:00:00Z'))/864e5)}
function fd(s){var a=String(s).split('-');return a.length===3?+a[2]+' '+MON[+a[1]-1]+' '+a[0]:s}
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function longDate(){var d=new Date();return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()}
function clockT(d){var h=d.getHours();return ('0'+((h%12)||12)).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+' '+(h>=12?'PM':'AM')}
function when(ts){var d=new Date(ts);return (iso(d)===today()?'Today':d.getDate()+' '+MON[d.getMonth()])+', '+clockT(d)}
var SAFE={'<':'‹','>':'›','"':'”',"'":'’','`':'’','\\':'/'};
function cl(s,n){return String(s==null?'':s).replace(/[<>"'`\\]/g,function(c){return SAFE[c]}).trim().slice(0,n||160)}
function num(v){var n=parseFloat(v);return isFinite(n)?n:0}
function val(id){var e=$('#'+id);return e?cl(e.value):''}
function by(arr,k,v){for(var i=0;i<arr.length;i++)if(arr[i][k]===v)return arr[i];return null}
function digits(s){return String(s).replace(/\D/g,'')}
function waNum(ph){var d=digits(ph);if(!d)return '';return d.indexOf('880')===0?d:d.charAt(0)==='0'?'88'+d:d}
function waLink(ph,m){return 'https://wa.me/'+waNum(ph)+'?text='+encodeURIComponent(m)}
function smsLink(ph,m){return 'sms:'+digits(ph)+'?body='+encodeURIComponent(m)}

/* ---- barcodes (demo codes use the 20x in-store prefix) ---- */
function ean13(s){var t=0;for(var i=0;i<12;i++)t+=(+s.charAt(i))*(i%2?3:1);return s+((10-t%10)%10)}

/* ---- batches ---- */
function sellable(b){return b.q>0&&b.rs!=='sent'&&b.rs!=='credit'&&b.e>=today()}
function lots(p){return p.bt.filter(sellable).sort(function(a,b){return a.e<b.e?-1:a.e>b.e?1:0})}
function sync(p){var l=lots(p),s=0;l.forEach(function(b){s+=b.q});p.s=s;if(l.length){p.e=l[0].e;p.b=l[0].b}p.ret=p.bt.some(function(b){return b.rs==='req'&&b.q>0})?1:0;p.m=p.p?Math.round((p.p-p.cost)/p.p*100):0}

function gross(o){var t=0;o.it.forEach(function(x){t+=x[2]*x[1]});return t}
function amt(o){return Math.max(0,gross(o)-(o.disc||0)-(o.redeem||0))}

/* sign +1 books an order, -1 reverses it (cancel) */
function book(o,sign){
  var a=amt(o),isToday=iso(new Date(o.ts))===DB.day,m=mg(o),wi=isToday?6:6-diffD(DB.day,iso(new Date(o.ts)));
  if(isToday){K.sales+=sign*a;K.profit+=sign*m}else if(wi>=0){W.s[wi]+=sign*a;W.p[wi]+=sign*m}
  if(o.pay==='Due'){if(sign>0)ledAdd(o.c,o.ph,a);else{var l=by(LED,'ph',o.ph),cut=l?Math.min(l.d,a):0;if(l){l.d-=cut;if(l.d<=0)LED.splice(LED.indexOf(l),1)}K.due-=cut;PAY.Cash-=a-cut}}
  else if(o.pay==='COD'){if(sign<0&&o.codPaid){PAY.Cash-=a;o.codPaid=0}}
  else PAY[o.pay]+=sign*a;
  if(sign>0){var g=gross(o)||1;o.it.forEach(function(x){var rv=x[2]*x[1];DB.sales.push({d:iso(new Date(o.ts)),n:x[0],q:x[1],rev:rv-((o.disc||0)+(o.redeem||0))*rv/g,cost:x[3]*x[1],o:o.id})})}
  else DB.sales=DB.sales.filter(function(s){return s.o!==o.id});
  var mem=by(DB.members,'ph',o.ph);if(mem)mem.pts=Math.max(0,mem.pts+sign*((o.earn||0)-(o.redeem||0)));
  DB.discLog.forEach(function(d){if(d.o===o.id)d.void=sign<0});
  DB.reg.forEach(function(r){if(r.o===o.id)r.void=sign<0})}

  var walk=!d.cust.ph;
  if(walk&&(d.pay==='Due'||d.pay==='COD'||d.delivery))return 'Select a customer for due, COD or delivery';
  if(flag){
    if(d.rx==='OTC')return 'Antibiotic / controlled medicine needs a prescription';
    if(walk)return 'Customer name and phone are needed for the register';
    if(!d.doc||!d.docReg)return 'Enter doctor name and registration number';
    if(flag==='ctl'&&!is('owner','pharmacist'))return 'Only a pharmacist can sell controlled medicine';
    if(flag==='ctl'&&!d.rxp)return 'Attach the prescription photo for controlled medicine'}
  if(d.rx==='Rx Verified'&&!is('owner','pharmacist'))d.rx='Rx Pending';
  var o={id:'SC-'+(DB.seq++),c:walk?'Walk-in customer':d.cust.n,a:walk?'Counter':d.cust.a,ph:walk?'':d.cust.ph,it:[],rx:d.rx,pay:d.pay,st:(d.rx==='Rx Pending'||d.delivery)?'Pending':'Delivered',ts:Date.now(),disc:0,redeem:0,earn:0,staff:cl(who()),rxp:d.rxp||'',doc:d.doc||'',docReg:d.docReg||''};
  if(d.keepPending)o.st='Pending';

  var g=gross(o);o.disc=Math.round(g*(d.discPct||0)/100);
  var mem=walk?null:by(DB.members,'ph',o.ph);
  if(mem&&d.redeem)o.redeem=Math.min(mem.pts,Math.floor(g-o.disc));
  if(mem)o.earn=Math.floor(amt(o)/100);
  if(d.delivery)o.dl={st:'Waiting',rider:''};
  O.unshift(o);K.orders++;K[o.st==='Pending'?'pend':'deliv']++;if(o.rx==='Rx Pending')K.rx++;
  if(o.disc)DB.discLog.unshift({ts:o.ts,o:o.id,staff:o.staff,c:o.c,pct:d.discPct,amt:o.disc,why:d.why||'—'});
  o.it.forEach(function(x){var q=pm(x[0]);if(q.ctl)DB.reg.unshift({ts:o.ts,o:o.id,type:q.ctl,med:q.n,gen:q.g,qty:x[1],batch:x[4].map(function(u){return u[0]}).join('/'),bal:q.s,pt:o.c,ph:o.ph,doc:o.doc,docReg:o.docReg,rxp:o.rxp,by:o.staff})});
  book(o,1);

    DB.outbox.unshift({id:o.id,ts:o.ts,type:'Order confirmation',n:o.c,ph:o.ph,msg:confirmMsg(o),sent:0})}
  log('Order '+o.id+' placed • '+T(amt(o)));

  LED.forEach(function(c){var k='due:'+c.ph;if(c.asked&&diffD(today(),c.asked)<DB.opt.dueDays)return;q.push({id:k,type:'Due reminder',n:c.n,ph:c.ph,msg:'আসসালামু আলাইকুম '+c.n+', '+S.cfg.name+' থেকে বলছি। আপনার বাকি আছে '+T(c.d)+'। সুবিধামতো পরিশোধ করলে কৃতজ্ঞ থাকব।'})});return q}

function handled(id,code){var m=MQ[id];if(!m)return;if(id.indexOf('rf:')===0){var r=by(R,'ph',m.ph);if(r)r.done=1}else if(id.indexOf('due:')===0){var c=by(LED,'ph',m.ph);if(c)c.asked=today()}
  var st=by(DB.outbox,'id',id);if(st&&id.indexOf('SC-')===0){st.sent=code;st.sentTs=Date.now()}else DB.outbox.unshift({id:id+':'+Date.now(),ts:Date.now(),type:m.type,n:m.n,ph:m.ph,msg:m.msg,sent:code,sentTs:Date.now()});log(m.type+(code===2?' skipped: ':' opened: ')+m.n);setTimeout(render,300)}

/* ===== 5: MR INVOICE (photo + assisted entry) ===== */
var MR={photo:'',co:'',inv:'',due:'',text:'',rows:[]};
function matchMed(s){var k=function(x){return x.toLowerCase().replace(/[^a-z0-9]/g,'')},a=k(s),best=null,bs=0;P.forEach(function(p){var b=k(p.n),sc=0;if(a.indexOf(b)>-1)sc=100+b.length;else{var w=p.n.toLowerCase().split(/\s+/),hit=w.filter(function(t){return a.indexOf(k(t))>-1}).length;if(a.indexOf(k(w[0]))>-1)sc=hit*10}if(sc>bs){bs=sc;best=p}});return best}
/* line format: name  qty  unit-cost  [batch]  [expiry as MM/YY or YYYY-MM-DD] */
function parseBill(t){var out=[];t.split(/\n+/).forEach(function(ln){var p=matchMed(ln);if(!p)return;var rest=ln,exp='',batch='',m;
  if((m=/\b(20\d\d-\d\d-\d\d)\b/.exec(rest))){exp=m[1];rest=rest.replace(m[0],' ')}else if((m=/\b(0?[1-9]|1[0-2])\/(\d\d|20\d\d)\b/.exec(rest))){var y=m[2].length===2?'20'+m[2]:m[2];exp=iso(new Date(+y,+m[1],0));rest=rest.replace(m[0],' ')}
  p.n.split(/\s+/).forEach(function(w){var i=rest.toLowerCase().indexOf(w.toLowerCase());if(i>-1)rest=rest.slice(0,i)+' '+rest.slice(i+w.length)});
  if((m=/\b(?=[A-Z0-9-]*[A-Z])(?=[A-Z0-9-]*\d)[A-Z]{1,4}-?\d{3,8}\b/.exec(rest))){batch=m[0];rest=rest.replace(m[0],' ')}
  var ns=(rest.replace(/(\d),(?=\d{3})/g,'$1').match(/\d+(\.\d+)?/g)||[]).map(Number);
  out.push({n:p.n,q:ns.length?Math.round(ns[0]):0,cost:ns.length>1?ns[1]:p.cost,b:batch,e:exp,raw:cl(ln)})});return out}
function mrTotal(){return MR.rows.reduce(function(s,r){return s+num(r.q)*num(r.cost)},0)}
function purchases(){
  var cos=[];P.forEach(function(p){if(cos.indexOf(p.c)<0)cos.push(p.c)});
  var rows=MR.rows.map(function(r,i){var inp=function(k,t){return '<input class="cell" type="'+t+'" data-mr="'+i+'" data-k="'+k+'" value="'+esc(r[k])+'" aria-label="'+k+'">'};
    return ['<select class="cell" data-mr="'+i+'" data-k="n" aria-label="Medicine">'+P.map(function(p){return '<option'+(p.n===r.n?' selected':'')+'>'+p.n+'</option>'}).join('')+'</select>',inp('q','number'),inp('cost','number'),inp('b','text'),inp('e','date'),btn('✕','mrdel','data-i="'+i+'"')]});
  return head('Purchases (MR Bills)','Photograph the company bill, enter the lines, and stock plus payables update together')+
  note('<b>Photo-to-text is not built in.</b> To avoid typing, use Google Lens or your phone’s “copy text from photo”, paste it below, and check every line before saving. Automatic OCR needs an outside OCR library or service.')+
  '<div class="grid g2">'+card('1. Bill photo',(MR.photo?'<img class="full" alt="Supplier bill" data-a="photo" data-id="'+MR.photo+'" src="'+PHOTOS[MR.photo]+'">':'<div class="em">Keep the photo with the purchase record.</div>')+'<div class="bgs" style="margin-top:10px">'+fileBtn('Take photo','mr',1)+fileBtn('From gallery','mr')+'</div>')+
  card('2. Bill lines','<div class="f"><label>One medicine per line: name, quantity, unit cost, batch, expiry<textarea id="mr-t" rows="6" data-mrf="text" placeholder="Napa Extra 500mg 100 20.5 NX2601 08/28">'+esc(MR.text)+'</textarea></label></div><div class="bs">'+btn('Read lines','mrparse','','')+btn('Add a line by hand','mradd','','ghost')+'</div>')+'</div>'+
  card('3. Check and save','<div class="f g2c">'+select('Company','mr-co',[['','Choose company']].concat(cos.map(function(c){return[c,c]})),MR.co,'data-mrf="co"')+field('Invoice number','mr-inv','data-mrf="inv"',MR.inv)+field('Payment due date','mr-due','type="date" data-mrf="due"',MR.due)+'</div><div style="margin-top:12px">'+table(['Medicine','Quantity','Unit cost ৳','Batch','Expiry','Remove'],rows,'No lines yet.')+'</div><div class="kvp tot"><b>Bill total</b><b class="big" id="mrtot">'+T(mrTotal())+'</b></div><div class="bs">'+btn('Add to stock and payables','mrsave','','')+'</div>')+
  card('Saved bills',table(['Company','Invoice','Date','Total','Photo'],DB.mr.map(function(m){return[m.co,m.inv||'—',fd(m.d),T(m.total),m.photo?btn('View','photo','data-id="'+m.photo+'"'):'—']})),' mt')}
ACT.mrparse=function(){var r=parseBill(MR.text);if(!r.length)return toast('No known medicine found in the text');MR.rows=r;if(!MR.co)MR.co=pm(r[0].n).c;render();toast(r.length+' lines read. Check each one.')};

ACT.mrsave=function(){if(!MR.co)return toast('Choose the company');if(!MR.rows.length)return toast('Add at least one line');
  for(var i=0;i<MR.rows.length;i++){var r=MR.rows[i];if(!(num(r.q)>0)||!(num(r.cost)>0)||!r.b||!/^\d{4}-\d\d-\d\d$/.test(r.e))return toast('Line '+(i+1)+': quantity, cost, batch and expiry are all needed');if(r.e<=today())return toast('Line '+(i+1)+': this batch is already expired')}
  var inv=cl(MR.inv);if(inv&&DB.mr.some(function(m){return m.co===MR.co&&m.inv===inv}))return toast('This invoice number is already saved');
  var tot=Math.round(mrTotal());MR.rows.forEach(function(r){var p=pm(r.n),q=Math.round(num(r.q)),old=p.s;p.cost=+(((p.cost*old)+(num(r.cost)*q))/(old+q)).toFixed(2);addLot(p,cl(r.b,30),r.e,q)});
  var due=MR.due||addD(today(),15);PB.unshift({c:MR.co+' MR',a:tot,due:fd(due),paid:0});DB.mr.unshift({co:MR.co,inv:inv,d:today(),total:tot,photo:MR.photo,rows:MR.rows});log('Purchase saved: '+MR.co+' '+T(tot));

  card('Return deadline per company','<p class="sub" style="margin-bottom:10px">How many days before expiry each company accepts returns. 30 is only a starting value; confirm with each MR.</p><div class="f g2c">'+cos.map(function(c,i){return field(c,'rd'+i,'type="number" min="0" data-rd="'+c+'"',DB.retDays[c]==null?30:DB.retDays[c])}).join('')+'</div>',' mt')}

  '<div class="grid k4">'+stat('Revenue',T(tr_))+stat('Gross profit',T(tp),(tr_?(tp/tr_*100).toFixed(1):0)+'% margin, before expenses')+stat('Money in stock (cost)',T(st))+stat('Stuck in dead stock',T(stuck),'60+ days unsold')+'</div>'+

function coldBad(c){return c<DB.opt.fmin||c>DB.opt.fmax}
function coldState(){var l=DB.cold[DB.cold.length-1];if(!l)return 'No reading yet';if(coldBad(l.c))return 'Out of range';if(iso(new Date(l.ts))!==today())return 'No reading today';return ''}
function coldChart(){var l=DB.cold.slice(-20);if(l.length<2)return '';var w=600,h=180,lo=Math.min(DB.opt.fmin-2,Math.min.apply(null,l.map(function(r){return r.c}))),hi=Math.max(DB.opt.fmax+2,Math.max.apply(null,l.map(function(r){return r.c}))),X_=function(i){return 30+i*(w-40)/(l.length-1)},Y=function(v){return 10+(h-30)*(hi-v)/(hi-lo)};
  return '<svg class="cc" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Fridge temperature chart"><rect x="30" y="'+Y(DB.opt.fmax)+'" width="'+(w-40)+'" height="'+(Y(DB.opt.fmin)-Y(DB.opt.fmax))+'" fill="var(--okb)"/><text class="lb" x="2" y="'+(Y(DB.opt.fmax)+4)+'">'+DB.opt.fmax+'°</text><text class="lb" x="2" y="'+(Y(DB.opt.fmin)+4)+'">'+DB.opt.fmin+'°</text><polyline fill="none" stroke="var(--pri)" stroke-width="2.5" points="'+l.map(function(r,i){return X_(i)+','+Y(r.c)}).join(' ')+'"/>'+l.map(function(r,i){return '<circle cx="'+X_(i)+'" cy="'+Y(r.c)+'" r="4" fill="'+(coldBad(r.c)?'var(--er)':'var(--pri)')+'"><title>'+r.c+'°C, '+when(r.ts)+'</title></circle>'}).join('')+'</svg>'}
function coldchain(){var s=coldState(),l=DB.cold[DB.cold.length-1];
  return head('Insulin Cold Chain','Fridge temperature log. Record it at least morning and evening.','<button class="btn ghost" data-a="coldcsv">Export CSV</button>')+
  (s?note('<b>'+s+'.</b> '+(s==='Out of range'?'Check the fridge now and ask the pharmacist before selling the affected stock.':'Take a reading from the fridge thermometer.'),'er'):note('Last reading is in range.'))+
  '<div class="grid g2">'+card('Add reading','<div class="f">'+field('Temperature °C','tc','type="number" step="0.1" inputmode="decimal" placeholder="4.5"')+field('Note','tn','placeholder="Power cut, door left open…"')+btn('Save reading','coldadd','','')+'</div><div class="f g2c" style="margin-top:14px">'+field('Minimum °C','o5','type="number" step="0.5" data-opt="fmin"',DB.opt.fmin)+field('Maximum °C','o6','type="number" step="0.5" data-opt="fmax"',DB.opt.fmax)+'</div>')+card('Last 20 readings'+(l?' • now '+l.c+'°C':''),coldChart()||'<div class="em">Add at least two readings.</div>')+'</div>'+

    if(u.kdf==='pbkdf2'&&!canPBKDF())return fail();
    var rem=$('#au-rem').checked;go_();
    derive(pass,u.salt,u.kdf).then(function(h){if(h!==u.hash)return aerr('Email or password is not correct');if(startSession({id:u.id},rem))enter();else fail()},fail)}
  else if(m==='signup'){
    var name=cl($('#au-name').value,60),shop=cl($('#au-shop').value,60);
    if(!name||!shop)return aerr('Enter your name and pharmacy name');
    if(u)return aerr('An account with this email already exists. Log in instead.');
    var id='u'+rand(6),salt=rand(16),kdf=canPBKDF()?'pbkdf2':'basic',code=newCode();go_();
    Promise.all([derive(pass,salt,kdf),derive(normCode(code),salt,kdf)]).then(function(h){
      var now=accounts();if(now.some(function(a){return a.email===email}))return aerr('An account with this email already exists. Log in instead.');
      /* the first account keeps data saved before login existed; later accounts get their own space */
      var first=!now.some(function(a){return a.ns===''}),ns=first?'':'-'+id;
      now.push({id:id,email:email,name:name,shop:shop,salt:salt,kdf:kdf,hash:h[0],rec:h[1],ns:ns,created:Date.now()});
      if(!saveAccounts(now))return aerr('This browser is blocking storage, so an account cannot be saved. Use Demo login.');
      try{var c=readJSON('localStorage','sc-cfg'+ns)||{};if(!c.name||c.name==='ShebaCare Pharma')c.name=shop;localStorage.setItem('sc-cfg'+ns,JSON.stringify(c));
        var p=readJSON('localStorage','sc-prof'+ns)||{};if(!p.name){p.name=name;p.role='Owner';p.email=email;localStorage.setItem('sc-prof'+ns,JSON.stringify(p))}}catch(e){}
      AU.busy=false;AU.code=code;AU.pending={id:id};AU.mode='code';paintAuth()},fail)}
  else{
    var rc=normCode($('#au-code').value);
    if(!u)return aerr('Email or recovery code is not correct');
    if(u.kdf==='pbkdf2'&&!canPBKDF())return fail();
    go_();derive(rc,u.salt,u.kdf).then(function(h){if(h!==u.rec)return aerr('Email or recovery code is not correct');
      return derive(pass,u.salt,u.kdf).then(function(nh){var now=accounts();now.forEach(function(a){if(a.id===u.id)a.hash=nh});if(!saveAccounts(now))return fail();AU.busy=false;AU.mode='login';paintAuth();$('#au-email').value=email;aerr('Password changed. Log in with the new password.')})},fail)}}

/* leaving: make sure the last change is written before the page reloads */
function logout(){var left=false,leave=function(){if(left)return;left=true;endSession();location.reload()};
  if(!READY)return leave();log('Logged out');clearTimeout(saveT);saveT=0;var j=JSON.stringify(DB);READY=false;stopScan();
  if(IDB){try{var tx=IDB.transaction('kv','readwrite');tx.objectStore('kv').put(j,'db');tx.oncomplete=tx.onerror=tx.onabort=leave;setTimeout(leave,2000)}catch(e){leave()}}
  else{try{localStorage.setItem(nsKey('sc-data'),j)}catch(e){}leave()}}
ACT.logout=function(){if(SES&&!SES.demo&&!window.confirm('Log out of this account?'))return;logout()};
ACT.tosignup=function(){try{sessionStorage.setItem('sc-authmode','signup')}catch(e){}logout()};
window.addEventListener('storage',function(e){if(e.key==='sc-session'&&SES&&!SES.demo&&!currentSession()){READY=false;location.reload()}});

document.addEventListener('input',function(e){if(e.target.id==='sbq'){SB.q=e.target.value;nav();tr($('#nav'))}});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'){stopScan();flush()}else if(READY&&DB.day<today())render()});
window.addEventListener('pagehide',flush);
var hs=/^#shop=([A-Za-z0-9_-]+)$/.exec(location.hash);
if(hs){applyTheme();$('#tabs').remove();shopPage(hs[1])}
else if(!SES){applyTheme();var am=null;try{am=sessionStorage.getItem('sc-authmode');sessionStorage.removeItem('sc-authmode')}catch(e){}
  AU.mode=am==='signup'||!accounts().length?(am||'login'):'login';showAuth();pwa()}
else openApp();
function openApp(){document.body.classList.remove('authing');$('#auth').innerHTML='';
paintProf();applyTheme();document.body.classList.toggle('rail',SB.rail);
  var TABS=null;try{TABS=new BroadcastChannel('shebacare'+NS)}catch(e){}
  /* two open tabs would overwrite each other's data, so only the newest one keeps saving */
  if(TABS)TABS.onmessage=function(){flush();READY=false;stopScan();var L=$('#lock');L.innerHTML='<div class="lkc"><h2>Opened in another tab</h2><p class="sub">This tab stopped saving so data is not overwritten.</p><div class="bs"><button class="btn lg-btn" id="rel">Use here</button></div></div>';L.className='on';$('#rel').onclick=function(){location.reload()}};
  loadData(function(){if(TABS)TABS.postMessage('open');try{applyLang()}catch(err){console.error(err);render()}if(DB.auth)lockScreen();pwa()})}
window.addEventListener('hashchange',function(){if(/^#shop=/.test(location.hash))location.reload()});
})();
</script>
